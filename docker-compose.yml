version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: kisanmitra_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=kisanmitra

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: kisanmitra_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/kisanmitra
      - DATA_SOURCE=MONGODB
    depends_on:
      - mongodb
    volumes:
      - ./backend/models/saved:/app/models/saved
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: kisanmitra_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
